services:
  orchestrator:
    build:
      context: .
      dockerfile: docker/orchestrator/Dockerfile.${ORCHESTRATOR_BUILD_TYPE:-cpu}
    ports:
      - "5001:5001"
    volumes:
      - ./orchestrator/data:/app/orchestrator/data         # uploads + DB persist
      - ./orchestrator/logs:/app/orchestrator/logs         # agent debug logs persist
      - ./mcp-monai/bundles:/app/mcp-monai/bundles         # model bundles persist
      - ./orchestrator/workspaces:/app/workspaces            # analysis results (read-write)
      - sample_data:/app/orchestrator/sample_data/exams    # TCIA sample CT data persist
      # User filesystem: mounted read-only so the workspace directory picker
      # can browse the user's files but the orchestrator cannot modify them.
      # /Users for macOS, /home for Linux.
      - ${HOST_HOME_PATH_MACOS:-/Users}:/Users:ro
      - ${HOST_HOME_PATH_LINUX:-/home}:/home:ro
    env_file: ./orchestrator/.env
    environment:
      - APP_ROOT=/app
      - WORKSPACES_ROOT=/app/workspaces
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      - "${FRONTEND_HOST_PORT:-80}:80"
    depends_on:
      orchestrator:
        condition: service_healthy

volumes:
  sample_data:

[tool.ruff]
line-length = 120
exclude = [
    "*/venv/*",
    "*/.venv/*",
    "node_modules",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"orchestrator/backend.py" = ["E402"]

[project]
name = "agentic_agent"
version = "0.1.0"
description = "AI agent for healthcare automation"
authors = [
]
readme = "README.md"
requires-python = ">=3.12, <3.13"

dependencies = [
    "fastapi>=0.100.0",
    "dotenv",
    "requests>=2.31.0",
    "google-genai",
    "python-multipart",
    "uvicorn>=0.23.0",
    "torch>=2.0.0", 
    "numpy>=1.24.0",
    "mcp",
    "Pillow",
    "monai>=1.3.0",
    "huggingface-hub>=0.18.0",
    "torchvision",
    "nibabel",
    "pydicom>=2.3.0",
    "itk",
    "beautifulsoup4",
    "tcia-utils",
    "watchdog>=4.0.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

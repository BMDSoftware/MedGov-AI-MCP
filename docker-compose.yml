services:
  orchestrator:
    build:
      context: .
      dockerfile: docker/orchestrator/Dockerfile.gpu
    ports:
      - "5001:5001"
    volumes:
      - ./orchestrator/data:/app/orchestrator/data   # uploads + DB persist
      - ./mcp-monai/bundles:/app/mcp-monai/bundles   # model bundles persist
    env_file: ./orchestrator/.env
    environment:
      - APP_ROOT=/app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - orchestrator

name: Docker Publish

on:
  workflow_dispatch: # manual trigger only

env:
  REGISTRY: ghcr.io

jobs:
  publish-orchestrator:
    if: github.repository == 'BMDSoftware/MedGov-AI-MCP'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Determine build type from deployment env
        run: |
          if [ -f /opt/medgov-ai-mcp/orchestrator/.env ]; then
            BUILD_TYPE=$(grep '^ORCHESTRATOR_BUILD_TYPE=' /opt/medgov-ai-mcp/orchestrator/.env | cut -d= -f2 | tr -d '"' | tr -d "'")
          fi
          echo "ORCHESTRATOR_BUILD_TYPE=${BUILD_TYPE:-cpu}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push orchestrator
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/orchestrator/Dockerfile.${{ env.ORCHESTRATOR_BUILD_TYPE }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/agentichealthmcp-orchestrator:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/agentichealthmcp-orchestrator:${{ github.sha }}

  publish-frontend:
    if: github.repository == 'BMDSoftware/MedGov-AI-MCP'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/agentichealthmcp-frontend:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/agentichealthmcp-frontend:${{ github.sha }}

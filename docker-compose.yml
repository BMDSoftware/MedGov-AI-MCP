services:
  orchestrator:
    build:
      context: .
      dockerfile: docker/orchestrator/Dockerfile.cpu
    ports:
      - "5001:5001"
    volumes:
      - ./orchestrator/data:/app/orchestrator/data         # uploads + DB persist
      - ./mcp-monai/bundles:/app/mcp-monai/bundles         # model bundles persist
    env_file: ./orchestrator/.env
    environment:
      - APP_ROOT=/app
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - orchestrator

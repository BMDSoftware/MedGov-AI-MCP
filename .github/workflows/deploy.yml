name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: github.repository == 'BMDSoftware/MedGov-AI-MCP'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Determine build type from deployment env
        run: |
          if [ -f /opt/medgov-ai-mcp/orchestrator/.env ]; then
            BUILD_TYPE=$(grep '^ORCHESTRATOR_BUILD_TYPE=' /opt/medgov-ai-mcp/orchestrator/.env | cut -d= -f2 | tr -d '"' | tr -d "'")
          fi
          echo "ORCHESTRATOR_BUILD_TYPE=${BUILD_TYPE:-cpu}" >> $GITHUB_ENV
          if [ "${BUILD_TYPE:-cpu}" = "gpu" ]; then
            echo "COMPOSE_FILE=docker-compose.yml:docker-compose.gpu.yml" >> $GITHUB_ENV
          else
            echo "COMPOSE_FILE=docker-compose.yml" >> $GITHUB_ENV
          fi

      - name: Prepare deploy directory
        run: |
          mkdir -p /opt/medgov-ai-mcp
          rsync -a --delete \
            --exclude 'orchestrator/.env' \
            --exclude 'orchestrator/data/' \
            --exclude 'mcp-monai/bundles/' \
            --exclude 'orchestrator/workspaces/' \
            . /opt/medgov-ai-mcp/

      - name: Build and start services
        working-directory: /opt/medgov-ai-mcp
        env:
          ORCHESTRATOR_BUILD_TYPE: ${{ env.ORCHESTRATOR_BUILD_TYPE }}
          COMPOSE_FILE: ${{ env.COMPOSE_FILE }}
        run: |
          docker compose build
          docker compose up -d
